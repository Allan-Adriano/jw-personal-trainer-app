version: "3.8"

networks:
  jwpersonal-network:
    driver: bridge

services:
  postgres:
    image: postgres:16.6
    container_name: jwpersonal-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - jwpersonal-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: jwpersonal-pgadmin
    ports:
      - "15433:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
    networks:
      - jwpersonal-network